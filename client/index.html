<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talerstol Timer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page">
    <div>
      <h1>Talerstol Timer</h1>
      <p>Opret et nyt møde/punkt, og vælg om denne enhed skal styre timeren eller vise den for salen.</p>
    </div>

    <form class="panel" id="create-form">
      <label for="title">Titel (valgfri)</label>
      <input type="text" id="title" placeholder="F.eks. Dagsordenspunkt 1" />

      <label>Taletid (min:sek)</label>
      <div id="duration"></div>

      <label>Hvad skal denne enhed bruges til?</label>
      <!-- Enter in a field submits with the first button, the classic flow. -->
      <div class="choices">
        <div class="choice">
          <button type="submit" class="primary" value="styring">Opret og styr herfra</button>
          <p>Du styrer timeren fra denne enhed og deler visningen med talere og tilhørere.</p>
        </div>
        <div class="choice">
          <button type="submit" class="primary" value="visning">Opret og vis på denne skærm</button>
          <p>Skærmen viser timeren i salen. Du styrer den fra din telefon via en QR-kode.</p>
        </div>
      </div>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/duration.js"></script>
  <script>
    const form = document.getElementById('create-form');
    const titleInput = document.getElementById('title');
    const durationInput = createDurationInput(document.getElementById('duration'), { seconds: 90 });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const title = titleInput.value.trim();
      const duration = durationInput.getSeconds();

      const { adminToken } = await createMeeting({ title, duration });

      const setup = event.submitter && event.submitter.value === 'visning' ? '&setup=visning' : '';
      location.href = `${location.origin}/admin.html?token=${adminToken}${setup}`;
    });
  </script>
</body>
</html>
